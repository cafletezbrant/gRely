base_model:
  name: Borzoi
  input_bp: 524288
  train_crop_bins: 6144          # central 196,608 bp (6,144 x 32 bp bins)
  output_resolution_bp: 32
  total_tracks: 7611
  gtex_tracks: 89
  replicates: 4                  # model0_best_{1..4}.h5
