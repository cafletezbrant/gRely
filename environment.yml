# Conda environment for gRely (feature extraction + train + apply).
#
# The Borzoi prediction stage additionally requires TensorFlow + the Borzoi
# package (baskerville / borzoi_helpers) from https://github.com/calico/borzoi
# in its own GPU env (e.g. a conda env named `borzoi` for GPU work and `dream`
# for eQTL curation).
#
# Versions are UNPINNED (see requirements.txt for the rationale). Pin from your
# working environment before release.
name: grely
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.9
  - pip
  - numpy
  - pandas
  - scipy
  - pyarrow
  - pyyaml
  - h5py
  - tqdm
  - pysam
  - pybigwig
  - pyfaidx
  - pyranges
  - bioframe
  - biopython
  - pip:
      - xgboost
      # feature-attribution analysis (stage 07): pip install -e ".[interpret]"
      # - shap
      # - umap-learn
      # - scikit-learn
      # - matplotlib
      # - tensorflow          # enable for the Borzoi prediction stage
      # editable install of this repo's package:
      - -e .
