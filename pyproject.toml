[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grely"
version = "0.1.0"
description = "gRely: reliability scoring for genome-trained sequence-to-function model predictions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Abdul Muntakim Rafi" },
    { name = "Gokcen Eraslan" },
    { name = "Kipper Fletez-Brant" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# NB: versions are intentionally left unpinned here. Pin exact versions from
# your working environment before release (see environment.yml).
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pyarrow",       # parquet IO
    "pyyaml",        # configs/*.yaml
    "xgboost",       # the gRely meta-model (train + apply)
    "tqdm",
    # --- feature extraction (stages 01-04) ---
    "biopython",     # Bio.SeqUtils.gc_fraction (variant_features.py)
    "pyfaidx",
    "pysam",
    "pyBigWig",      # EpiMap bigWig + phyloP reads
    "pyranges",      # blacklist overlap (find_pos/find_neg)
    "bioframe",      # TFRecord interval overlap
    "h5py",
]

[project.optional-dependencies]
# Heavy / environment-specific deps for the Borzoi prediction + featurization
# stages. Borzoi itself (baskerville, borzoi_helpers) is installed separately
# from https://github.com/calico/borzoi — see README.
borzoi = [
    "tensorflow",
]
# Feature-attribution analysis (stage 07: grely.attribution).
interpret = [
    "shap",
    "umap-learn",
    "scikit-learn",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
